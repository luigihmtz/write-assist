<!doctype html>
<!--
index.html
Write Assist window: Prompt and Draft fields (review or create), result with
highlighted edits, changes and notes, thesaurus and translate panels, speech
buttons, settings dialog. Rendered by writeAssist.pyw in a WebView2 window.

Author:  Luis Martinez
Email:   16788942+luigihmtz@users.noreply.github.com
Version: v01.17.00
Date:    2026-11-26

Usage: loaded by writeAssist.pyw through pywebview; talks to Python through
       window.pywebview.api (see app.js). Visible text comes from i18n.js
       through the data-i18n* attributes; the English here is the fallback.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Write Assist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <label class="field" data-i18n-title="mode.title"><span data-i18n="mode">Mode</span>
      <select id="mode">
        <option value="fix" data-i18n="mode.fix" data-i18n-title="mode.fix.title">fix errors only</option>
        <option value="polish" data-i18n="mode.polish" data-i18n-title="mode.polish.title">fix and polish wording</option>
      </select>
    </label>
    <label class="field"><span data-i18n="tone">Tone</span>
      <select id="tone">
        <option value="keep" data-i18n="tone.keep">keep</option>
        <option value="more formal" data-i18n="tone.formal">more formal</option>
        <option value="more casual" data-i18n="tone.casual">more casual</option>
        <option value="friendlier" data-i18n="tone.friendlier">friendlier</option>
        <option value="more concise" data-i18n="tone.concise">more concise</option>
      </select>
    </label>
    <label class="field" data-i18n-title="language.title"><span data-i18n="language">Language</span>
      <select id="textLanguage">
        <option value="auto" data-i18n="language.auto">Auto</option>
        <option value="English (US)">English (US)</option>
        <option value="English (UK)">English (UK)</option>
        <option value="Spanish (Mexico)">Español (México)</option>
        <option value="Spanish (Spain)">Español (España)</option>
        <option value="French">Français</option>
        <option value="Portuguese (Brazil)">Português (Brasil)</option>
        <option value="German">Deutsch</option>
        <option value="Italian">Italiano</option>
      </select>
    </label>
    <label class="field"><span data-i18n="ai">AI</span> <select id="provider"></select></label>
    <label class="field"><span data-i18n="model">Model</span> <select id="model"></select></label>
    <label class="field" data-i18n-title="check.title"><span data-i18n="check.label">Underline</span>
      <select id="checkMode">
        <option value="off" data-i18n="check.off" data-i18n-title="check.offHint">off</option>
        <option value="spelling" data-i18n="check.spelling" data-i18n-title="check.spellingHint">spelling</option>
        <option value="grammar" data-i18n="check.grammar" data-i18n-title="check.grammarHint">spelling + grammar</option>
      </select>
    </label>
    <span class="spacer"></span>
    <span class="toolbar-actions">
    <button id="openSessionBtn" class="ghost" data-i18n="session.open" data-i18n-title="session.openTitle">Open session</button>
    <button id="saveSessionBtn" class="ghost" data-i18n="session.save" data-i18n-title="session.saveTitle">Save session</button>
    <button id="translateBtn" class="ghost" data-i18n="translate" data-i18n-title="translate.title">Translate</button>
    <button id="thesaurusBtn" class="ghost" data-i18n="thesaurus" data-i18n-title="thesaurus.title">Thesaurus</button>
    <button id="settingsBtn" class="ghost" data-i18n="settings" data-i18n-title="settings.title">Settings</button>
    <button id="aboutBtn" class="ghost" data-i18n="about" data-i18n-title="about.title">About</button>
    </span>
  </header>

  <main class="grid">
    <div class="column">
      <section class="card prompt-card">
        <div class="card-head" id="promptHead">
          <h2 data-i18n="prompt">Prompt</h2>
          <span class="hint" id="promptHint">context or instructions, optional for review</span>
          <span class="spacer"></span>
          <div class="task-switch" role="radiogroup" data-i18n-title="switch.title">
            <button type="button" class="seg" id="segDraft" role="radio">Review</button>
            <button type="button" class="seg" id="segRefine" role="radio" data-i18n="run.refine">Refine</button>
          </div>
          <select id="preset" data-i18n-title="preset.title">
            <option value="" data-i18n="preset">Insert preset...</option>
          </select>
          <button class="tool mic" data-target="prompt" data-i18n-title="dictate.prompt"></button>
        </div>
        <textarea id="prompt" spellcheck="false" data-i18n-placeholder="prompt.placeholder"></textarea>
      </section>
      <div class="splitter splitter-h" data-split="left" data-i18n-title="layout.split"></div>

      <section class="card draft-card">
        <div class="card-head tint-draft">
          <h2 data-i18n="draft">Draft</h2>
          <span class="hint" data-i18n="draft.hint">text to review, leave empty to create</span>
          <span class="spacer"></span>
          <button class="tool mic" data-target="draft" data-i18n-title="dictate.draft"></button>
          <button class="tool" id="pasteBtn" data-i18n="paste" data-i18n-title="paste.title">Paste &amp; review</button>
          <button class="tool" id="clearBtn" data-i18n="clear">Clear</button>
        </div>
        <div class="format-bar" data-target="draft"></div>
        <div id="draft" class="result" contenteditable="true" spellcheck="false" data-i18n-placeholder="draft.placeholder"></div>
      </section>
    </div>

    <div class="splitter splitter-v" data-split="cols" data-i18n-title="layout.split"></div>

    <div class="column">
      <section class="card result-card">
        <div class="card-head" id="resultHead">
          <h2 id="resultTitle" data-i18n="result">Result</h2>
          <span class="spacer"></span>
          <button class="tool" id="historyToggle" data-i18n="history" data-i18n-title="history.title">History</button>
          <button class="tool" id="useDraftBtn" data-i18n="useDraft" data-i18n-title="useDraft.title">Use as draft</button>
          <button class="tool" id="exportBtn" data-i18n="export" data-i18n-title="export.title">Export</button>
          <button class="tool primary-soft" id="copyBtn" data-i18n="copy" data-i18n-title="copy.title">Copy</button>
        </div>
        <div class="format-bar" id="formatBar" data-target="result">
          <button class="fmt" data-cmd="bold" data-i18n-title="fmt.bold"><b>B</b></button>
          <button class="fmt" data-cmd="italic" data-i18n-title="fmt.italic"><i>I</i></button>
          <button class="fmt" data-cmd="underline" data-i18n-title="fmt.underline"><u>U</u></button>
          <button class="fmt" data-cmd="strikeThrough" data-i18n-title="fmt.strike"><s>S</s></button>
          <span class="fmt-sep"></span>
          <button class="fmt" data-cmd="insertUnorderedList" data-i18n-title="fmt.bullets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5a1.5 1.5 0 1 0 0 .01ZM8 5.5h12v2H8Zm-4 6a1.5 1.5 0 1 0 0 .01ZM8 11h12v2H8Zm-4 6.5a1.5 1.5 0 1 0 0 .01ZM8 16.5h12v2H8Z"/></svg></button>
          <button class="fmt" data-cmd="insertOrderedList" data-i18n-title="fmt.numbers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2v4H4V6H3Zm0 7.5c0-.8.7-1.5 1.5-1.5S6 11.7 6 12.4c0 .5-.3.9-.7 1.3L4.5 14.5H6V16H3v-1.2l1.6-1.6c.2-.2.3-.4.3-.6 0-.2-.2-.3-.4-.3s-.4.2-.4.4H3Zm5-7h12v2H8Zm0 5.5h12v2H8Zm0 5.5h12v2H8Z"/></svg></button>
          <span class="fmt-sep"></span>
          <button class="fmt" data-cmd="link" data-i18n-title="fmt.link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.4-3.4a1 1 0 1 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0Zm-2.1 4.2a3.5 3.5 0 0 1-2.5-6l2-2a1 1 0 1 1 1.4 1.4l-2 2a1.5 1.5 0 0 0 2.1 2.1l2-2a1 1 0 0 1 1.4 1.4l-2 2a3.5 3.5 0 0 1-2.4 1.1Zm6.6-3.2a1 1 0 0 1-.7-1.7l2-2a1.5 1.5 0 0 0-2.1-2.1l-2 2a1 1 0 0 1-1.4-1.4l2-2a3.5 3.5 0 0 1 5 5l-2 2a1 1 0 0 1-.8.2Z"/></svg></button>
          <button class="fmt" data-cmd="clear" data-i18n-title="fmt.clear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h12v2.5h-2V7h-3.1l-1.3 6.3L10 11.8 10.9 7H8v.5H6Zm-1.7 1.3 1.4-1.4 14 14-1.4 1.4-5.6-5.6-1.1 5.3H9.4l1.3-6.5Z"/></svg></button>
        </div>
        <div class="result-body">
          <div id="result" class="result" contenteditable="true" spellcheck="false" data-i18n-placeholder="result.placeholder"></div>
          <aside id="histColumn" class="hist-column" hidden>
            <div class="hist-save">
              <input id="histLabel" data-i18n-placeholder="history.labelPlaceholder" spellcheck="true" autocomplete="off">
              <div class="hist-save-buttons">
                <button class="tool primary-soft" id="histSave" data-i18n="history.save" data-i18n-title="history.saveTitle">Save current draft</button>
                <button class="tool" id="histClear" data-i18n="history.clear" data-i18n-title="history.clearTitle">Clear</button>
              </div>
            </div>
            <div id="histList" class="hist-list"></div>
          </aside>
        </div>
      </section>
      <div class="splitter splitter-h" data-split="right" data-i18n-title="layout.split"></div>

      <section class="card changes-card">
        <div class="card-head"><h2 data-i18n="changes">Changes and notes</h2></div>
        <div id="changes" class="changes"></div>
      </section>
    </div>
  </main>

  <footer class="statusbar">
    <button id="runBtn" class="primary" data-i18n="run.run">Run</button>
    <span class="run-hints">
      <span class="run-hint tone-review" id="hintDraft"></span>
      <span class="run-hint tone-refine" id="hintRefine" data-i18n-title="run.refineTitle"></span>
    </span>
    <label class="check"><input type="checkbox" id="autoCopy"> <span data-i18n="autoCopy">Copy result automatically</span></label>
    <button id="updateBtn" class="update" hidden></button>
    <span id="status" class="status"></span>
  </footer>

  <div id="thesaurus" class="popover" hidden>
    <div class="popover-head">
      <button class="ghost small" id="thBack" data-i18n-title="th.back" hidden>←</button>
      <input id="thSearch" type="search" data-i18n-placeholder="th.search" spellcheck="true" autocomplete="off">
      <button class="ghost small detach" data-i18n-title="panel.detach" aria-label="Detach">⧉</button>
      <button class="ghost small" id="thClose" data-i18n-title="th.close">✕</button>
    </div>
    <div id="thBody" class="popover-body"></div>
    <div id="thMenu" class="chip-menu" hidden>
      <button class="tool" id="thReplace" data-i18n="th.replace">Replace</button>
      <button class="tool" id="thLookup" data-i18n="th.lookup">Search</button>
    </div>
  </div>

  <div id="translatePanel" class="popover" hidden>
    <div class="popover-head">
      <strong data-i18n="translate">Translate</strong>
      <span class="muted" data-i18n="tr.to">to</span>
      <select id="trTarget">
        <option value="auto" data-i18n="tr.auto">English ⇄ Spanish</option>
        <option value="English">English</option>
        <option value="Spanish">Español</option>
        <option value="French">Français</option>
        <option value="Portuguese">Português</option>
        <option value="German">Deutsch</option>
        <option value="Italian">Italiano</option>
      </select>
      <span class="spacer"></span>
      <button class="ghost small detach" data-i18n-title="panel.detach" aria-label="Detach">⧉</button>
      <button class="ghost small" id="trClose" data-i18n-title="th.close">✕</button>
    </div>
    <div class="popover-body">
      <div id="trInput">
        <textarea id="trSource" rows="3" spellcheck="true" data-i18n-placeholder="tr.placeholder"></textarea>
        <div class="tr-actions">
          <button class="primary small-primary" id="trGo"><span data-i18n="tr.go">Translate</span> <kbd class="kbd-run">Ctrl+Enter</kbd></button>
        </div>
      </div>
      <div id="trOut" hidden>
        <p id="trMeta" class="tr-meta muted"></p>
        <div id="trText" class="tr-text"></div>
        <div id="trAltBlock" hidden>
          <h3 data-i18n="tr.alternatives">Other options</h3>
          <div id="trAlts" class="chips"></div>
        </div>
        <p id="trNote" class="tr-note" hidden></p>
        <div class="tr-actions">
          <button class="tool" id="trReplace" data-i18n="tr.replace" data-i18n-title="tr.replace.title">Replace selection</button>
          <button class="tool" id="trUseDraft" data-i18n="tr.useDraft">Use as draft</button>
          <button class="tool primary-soft" id="trCopy" data-i18n="tr.copy">Copy</button>
        </div>
      </div>
    </div>
  </div>

  <div id="ltPop" class="lt-pop" hidden>
    <p id="ltMsg" class="lt-msg"></p>
    <div id="ltReps" class="chips"></div>
    <div class="lt-actions"><button class="ghost small" id="ltIgnore" data-i18n="lt.ignore">Ignore</button></div>
  </div>

  <dialog id="quitDialog">
    <form method="dialog" class="dialog narrow">
      <h2 data-i18n="quit.title">Save this session?</h2>
      <p data-i18n="quit.text"></p>
      <div class="dialog-buttons">
        <button type="button" id="quitCancel" class="ghost" data-i18n="cancel">Cancel</button>
        <button type="button" id="quitDiscard" class="ghost" data-i18n="quit.discard">Don't save</button>
        <button type="button" id="quitSave" class="primary" data-i18n="quit.save">Save...</button>
      </div>
    </form>
  </dialog>

  <dialog id="aboutDialog">
    <form method="dialog" class="dialog narrow about">
      <h2>Write Assist</h2>
      <p id="aboutVersion" class="muted"></p>
      <p data-i18n="about.text"></p>
      <p id="aboutAuthor"></p>
      <p data-i18n="about.license"></p>
      <p class="about-links">
        <button type="button" class="link-button" id="aboutProject" data-i18n="about.project">Project page</button>
        <span class="muted">·</span>
        <button type="button" class="link-button" id="aboutCredits" data-i18n="about.credits">Credits and licenses</button>
      </p>
      <p id="aboutUpdate" class="muted" hidden></p>
      <div class="dialog-buttons">
        <button type="button" id="aboutDiag" class="ghost" data-i18n="about.diag" data-i18n-title="about.diagTitle">Copy diagnostics</button>
        <button type="button" id="aboutCheck" class="ghost" data-i18n="about.check">Check for updates</button>
        <button type="button" id="aboutClose" class="primary" data-i18n="about.close">Close</button>
      </div>
    </form>
  </dialog>

  <dialog id="exportDialog">
    <form method="dialog" class="dialog narrow">
      <h2 data-i18n="export">Export</h2>
      <label class="block" id="expWhatBlock"><span data-i18n="export.what">Text</span>
        <select id="expWhat">
          <option value="result" data-i18n="export.result">Result</option>
          <option value="draft" data-i18n="export.draft">Draft</option>
        </select>
      </label>
      <p id="expVersion" class="muted" hidden></p>
      <label class="block"><span data-i18n="export.format">Format</span>
        <select id="expFormat">
          <option value="docx" data-i18n="export.fmtDocx">Word document (.docx)</option>
          <option value="pdf" data-i18n="export.fmtPdf">PDF (.pdf)</option>
          <option value="txt" data-i18n="export.fmtTxt">Text (.txt)</option>
          <option value="md" data-i18n="export.fmtMd">Markdown (.md)</option>
        </select>
      </label>
      <label class="check-block">
        <input type="checkbox" id="expDetails" checked>
        <span><strong data-i18n="export.details">Add details at the end</strong>
          <span class="muted" data-i18n="export.detailsHint"></span></span>
      </label>
      <div class="block" id="expCloudBlock" hidden><span data-i18n="export.cloudTitle">Or save straight to:</span>
        <span id="expClouds" class="export-clouds"></span>
      </div>
      <p id="expError" class="error" hidden></p>
      <div class="dialog-buttons">
        <button type="button" id="expCancel" class="ghost" data-i18n="cancel">Cancel</button>
        <button type="button" id="expSaveAs" class="primary" data-i18n="export.saveAs">Save as...</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog">
      <h2 id="settingsTitle" data-i18n="settings">Settings</h2>
      <p id="welcomeText" class="muted" data-i18n="settings.welcomeText" hidden></p>
      <label class="block"><span data-i18n="settings.about">About you</span>
        <span class="muted" data-i18n="settings.aboutHint"></span>
        <textarea id="profile" rows="4" spellcheck="true" data-i18n-placeholder="settings.aboutPlaceholder"></textarea>
      </label>
      <label class="block" id="hotkeyBlock"><span data-i18n="settings.hotkey">Global hotkey</span>
        <span class="muted" data-i18n="settings.hotkeyHint"></span>
        <input id="hotkey" spellcheck="false">
      </label>
      <label class="block"><span data-i18n="settings.microphone">Microphone for dictation</span>
        <select id="microphone">
          <option value="" data-i18n="settings.micDefault">Same as Windows</option>
        </select>
      </label>
      <div class="row">
        <label class="block"><span data-i18n="settings.speechModel">Speech model</span>
          <select id="speechModel">
            <option value="base" data-i18n="settings.speechBase">base</option>
            <option value="small" data-i18n="settings.speechSmall">small</option>
            <option value="medium" data-i18n="settings.speechMedium">medium</option>
          </select>
        </label>
        <label class="block"><span data-i18n="settings.speechLanguage">Speech language</span>
          <select id="speechLanguage">
            <option value="" data-i18n="settings.detect">Detect automatically</option>
            <option value="en" data-i18n="settings.english">English</option>
            <option value="es" data-i18n="settings.spanish">Spanish</option>
            <option value="fr" data-i18n="settings.french">French</option>
          </select>
        </label>
        <label class="block"><span data-i18n="settings.uiLanguage">Interface language</span>
          <select id="uiLanguage">
            <option value="" data-i18n="settings.uiAuto">Same as Windows</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
          </select>
        </label>
      </div>
      <label class="block"><span data-i18n="settings.author">Your name (for exports)</span>
        <span class="muted" data-i18n="settings.authorHint"></span>
        <input id="authorName" spellcheck="false">
      </label>
      <div class="history-setting">
        <label class="check-block">
          <input type="checkbox" id="historyOn">
          <span><strong data-i18n="settings.history">Keep version history</strong>
            <span class="muted" data-i18n="settings.historyHint"></span></span>
        </label>
        <button type="button" class="ghost small" id="historyClear" data-i18n="settings.clearHistory">Clear history</button>
      </div>
      <label class="block"><span data-i18n="settings.onClose">When closing Write Assist</span>
        <select id="onClose">
          <option value="keep" data-i18n="settings.onClose.keep">Keep my work for next time</option>
          <option value="ask" data-i18n="settings.onClose.ask">Ask to save the session</option>
          <option value="nothing" data-i18n="settings.onClose.nothing">Start empty next time</option>
        </select>
      </label>
      <p id="versionText" class="muted small"></p>
      <p id="settingsError" class="error" hidden></p>
      <div class="dialog-buttons">
        <button type="button" id="settingsCancel" class="ghost" data-i18n="cancel">Cancel</button>
        <button type="button" id="settingsSave" class="primary" data-i18n="save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDialog">
    <form method="dialog" class="dialog narrow">
      <h2 id="confirmTitle"></h2>
      <p id="confirmText"></p>
      <div class="dialog-buttons">
        <button type="button" id="confirmNo" class="ghost" data-i18n="notNow">Not now</button>
        <button type="button" id="confirmYes" class="primary" data-i18n="ok">OK</button>
      </div>
    </form>
  </dialog>

  <div id="printArea" aria-hidden="true"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
